modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="logo.png"
enumExtensions="META-INF/enumextensions.json"

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}.client.mixins.json"

[[mixins]]
config="${mod_id}.thaumaturge.mixins.json"
requiredMods = ["thaumaturge"]

[[dependencies.${mod_id}]]
modId="thaumaturge"
type="optional"
versionRange="[1.0.12,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="slashblade"
type = "required"
versionRange="${slash_blade_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sbr_core"
type = "required"
versionRange="${mrqx_slash_blade_core_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="truepower"
type = "required"
versionRange="${true_power_version_range}"
ordering="NONE"
side="BOTH"


[[dependencies.${mod_id}]]
modId="more_slashblade_ex_enchantment_effects"
type = "required"
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"
